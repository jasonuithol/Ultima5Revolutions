name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: rust
      - name: Package
        shell: bash
        run: |
          set -e
          NAME=ultima5-${GITHUB_REF_NAME}-${{ matrix.suffix }}
          mkdir -p dist/$NAME
          cp README.md dist/$NAME/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp rust/target/${{ matrix.target }}/release/ultima5.exe dist/$NAME/
            (cd dist && 7z a -tzip $NAME.zip $NAME > /dev/null)
          else
            cp rust/target/${{ matrix.target }}/release/ultima5 dist/$NAME/
            (cd dist && tar czf $NAME.tar.gz $NAME)
          fi
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
